# dsh-chat-manager bundle patch: replace the shipped workspace browser with
# the forked copy (same visuals, plus 删除会话 in the session menu and the
# 聊天 section) and mount the chat-manager host half.
#
# Declared via `dsh.bundle.patch` in package.json, so `dsh plugin add`
# registers this package as a profile layer automatically — users do not
# need to edit their profile's cordis.patch.yml.
#
# (reload marker r3: chat search control, split panes, statuses, archive ui)
# (reload marker r4: workspace pane scrollbar fix - drop pane overflow:hidden)
# (reload marker r5: no-reload delete + tombstone filter + host delete ordering)
# (reload marker r6: blank chat row visible, chat search skips blank rows,
#  archived delete copy mentions folder kept, host search excludes subagents,
#  archive removal moved last in the delete route)
# (reload marker r7: archived page shows last-updated time, delete confirm
#  copy neutralized to plain 文件夹 for workspace sessions too)
# (reload marker r8: settings page time keys - chatManager dictionary gains
#  the time.* keys so the archived list shows real relative time labels)
- id: ui-workspace
  disabled: true

- insert:
    - id: ui-chat-manager
      name: dsh-chat-manager
